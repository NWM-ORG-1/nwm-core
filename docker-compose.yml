# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nwm
      POSTGRES_PASSWORD: nwm
      POSTGRES_DB: nwm
    ports:
      - "5432:5432"
    volumes:
      - nwm-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nwm -d nwm"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  nwm-pg:
